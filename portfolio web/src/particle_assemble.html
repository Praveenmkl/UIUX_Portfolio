const off=document.createElement('canvas');off.width=img.width;off.height=img.height;const oc=off.getContext('2d',{willReadFrequently:true});oc.drawImage(img,0,0);const px=oc.getImageData(0,0,off.width,off.height).data;
// Sample only the pale-yellow fingerprint strokes; ignore the white image background.
particles=[];const step=3;for(let y=0;y<off.height;y+=step){for(let x=0;x<off.width;x+=step){const i=(y*off.width+x)*4,r=px[i],g=px[i+1],b=px[i+2];if(r>205&&g>180&&b<215&&(r-b)>25){if(Math.random()>.67)continue;const tx=ox+x/off.width*side,ty=oy+y/off.height*side;const a=Math.random()*Math.PI*2,dist=side*(.35+Math.random()*.65);particles.push({tx,ty,sx:w/2+Math.cos(a)*dist,sy:h/2+Math.sin(a)*dist,delay:Math.random()*.38,r:Math.random()*1.1+.65,color:`rgb(${r},${g},${b})`})}}}
ready=true;restart()}
function draw(time){if(!ready)return;const t=Math.min(1,elapsed/duration);const {w,h}=dim;ctx.clearRect(0,0,w,h);
for(const p of particles){const q=Math.max(0,Math.min(1,(t-p.delay)/(1-p.delay)));const k=ease(q);const swirl=(1-k)*18;const x=p.sx+(p.tx-p.sx)*k+Math.sin(k*8+p.ty*.07)*swirl;const y=p.sy+(p.ty-p.sy)*k+Math.cos(k*7+p.tx*.06)*swirl;ctx.globalAlpha=Math.min(1,q*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,p.r*(.75+.25*k),0,Math.PI*2);ctx.fill()}
ctx.globalAlpha=1;
// Resolve the assembled dots into the exact original fingerprint artwork.
if(t>.78){const alpha=ease(Math.min(1,(t-.78)/.22));ctx.globalAlpha=alpha;const side=Math.min(w,h)*.78;ctx.drawImage(img,(w-side)/2,(h-side)/2,side,side);ctx.globalAlpha=1}
}
function tick(now){if(!paused){elapsed=Math.min(duration,now-start);draw();if(elapsed<duration)raf=requestAnimationFrame(tick);else{raf=0;toggle.textContent='Pause'}}}
function restart(){cancelAnimationFrame(raf);elapsed=0;paused=false;toggle.textContent='Pause';start=performance.now();raf=requestAnimationFrame(tick)}
replay.addEventListener('click',restart);toggle.addEventListener('click',()=>{if(!ready)return;if(!paused){paused=true;cancelAnimationFrame(raf);toggle.textContent='Resume'}else{paused=false;start=performance.now()-elapsed;toggle.textContent='Pause';raf=requestAnimationFrame(tick)}});
img.onload=build;window.addEventListener('resize',()=>{clearTimeout(window._resizeT);window._resizeT=setTimeout(build,180)});
if(img.complete&&img.naturalWidth)build();
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){img.onload=()=>{dim=size();ready=true;particles=[];elapsed=duration;draw()}}
</script></body></html>
